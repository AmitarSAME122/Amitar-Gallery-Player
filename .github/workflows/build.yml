name: Verify and build AmitarGalleryPlayer

on:
  push:
    branches: [ Amitar, main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'SHA256SUMS.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amitar-gallery-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Java for Android tooling
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate platform host projects and apply permissions
        run: python3 tool/bootstrap_platforms.py
      - name: Restore and verify tracked Flutter metadata and dependency lock
        run: |
          git restore --source=HEAD --worktree -- .metadata pubspec.lock
          git diff --exit-code HEAD -- .metadata pubspec.lock
      - name: Regenerate canonical source checksums on the GitHub runner
        run: python3 tool/update_source_checksums.py
      - name: Upload the verified Gradle Wrapper JAR for native build jobs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agp-gradle-wrapper-8.14.6
          path: android/gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: error
          retention-days: 1
      - name: Install Python tooling test dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement tool/requirements-branding.txt
      - name: Check release version identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 tool/check_release_version.py --tag "${GITHUB_REF_NAME}"
          else
            python3 tool/check_release_version.py
          fi
      - name: Test project and CI tooling invariants
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v
      - name: Resolve dependencies from the committed pubspec
        run: flutter pub get
      - name: Validate source and resolved dependency contracts
        run: python3 tool/validate_source_contracts.py
      - name: Generate and validate app icons
        run: dart run flutter_launcher_icons
      # Never run `dart fix --apply` in CI: quick-fixes can mutate pubspec.yaml
      # (for example by promoting cross_file to a direct dependency) after the
      # source snapshot has been selected. The source contract is checked above.
      - name: Apply canonical Dart formatting on branches
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            dart format --output=none --set-exit-if-changed lib test
          else
            dart format lib test
            dart format --output=none --set-exit-if-changed lib test
          fi
      - name: Collect the exact quality-job source snapshot
        run: python3 tool/collect_ci_snapshot.py "$RUNNER_TEMP/agp-quality-source"
      - name: Upload the exact source snapshot analyzed by quality CI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agp-quality-source-snapshot
          path: ${{ runner.temp }}/agp-quality-source/
          if-no-files-found: error
          retention-days: 1
      - name: Static analysis
        run: flutter analyze
      - name: Regression tests
        run: flutter test --reporter expanded
      - name: Share the resolved dependency lock with native build jobs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agp-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1

  linux-android-web:
    name: Linux + Android + Web release-mode builds
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Download the checksum-verified Gradle Wrapper JAR
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-gradle-wrapper-8.14.6
          path: android/gradle/wrapper
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv
      - name: Generate platform hosts
        run: python3 tool/bootstrap_platforms.py
      - name: Download the exact analyzed source snapshot
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-quality-source-snapshot
          path: ${{ runner.temp }}/agp-quality-source
      - name: Download the exact resolved dependency lock
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-pubspec-lock
          path: ${{ runner.temp }}/agp-pubspec-lock
      - name: Apply the analyzed source and dependency snapshot
        run: >-
          python3 tool/apply_ci_snapshot.py
          --artifact-dir "$RUNNER_TEMP/agp-quality-source"
          --lock-file "$RUNNER_TEMP/agp-pubspec-lock/pubspec.lock"
      - name: Configure optional Android publisher signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.AMITAR_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.AMITAR_ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.AMITAR_ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.AMITAR_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "::notice::Android publisher signing secrets are not configured; QA APK/AAB outputs will use the ephemeral debug key."
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Set all four AMITAR_ANDROID_* signing secrets or none of them."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/amitar-gallery-player-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore_path"
          } > android/key.properties
          chmod 600 "$keystore_path" android/key.properties
      - name: Resolve dependencies from the tested lock
        run: flutter pub get --enforce-lockfile
      - name: Build Android, Web and Linux
        run: python3 tool/build.py all --skip-bootstrap --skip-checks
      - name: Finalize Linux/Android/Web checksums
        run: python3 tool/finalize_artifacts.py --label linux-android-web
      - name: Upload verified build outputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AmitarGalleryPlayer-linux-android-web
          path: dist/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows desktop release-mode build
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Download the checksum-verified Gradle Wrapper JAR
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-gradle-wrapper-8.14.6
          path: android/gradle/wrapper
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Generate platform hosts
        shell: pwsh
        run: python tool/bootstrap_platforms.py
      - name: Download the exact analyzed source snapshot
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-quality-source-snapshot
          path: ${{ runner.temp }}/agp-quality-source
      - name: Download the exact resolved dependency lock
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-pubspec-lock
          path: ${{ runner.temp }}/agp-pubspec-lock
      - name: Apply the analyzed source and dependency snapshot
        shell: pwsh
        run: >-
          python tool/apply_ci_snapshot.py
          --artifact-dir "$env:RUNNER_TEMP/agp-quality-source"
          --lock-file "$env:RUNNER_TEMP/agp-pubspec-lock/pubspec.lock"
      - name: Resolve dependencies from the tested lock
        shell: pwsh
        run: flutter pub get --enforce-lockfile
      - name: Build Windows installer and portable bundle
        shell: pwsh
        run: python tool/build.py windows --skip-bootstrap --skip-checks
      - name: Finalize Windows checksums
        shell: pwsh
        run: python tool/finalize_artifacts.py --label windows
      - name: Upload Windows build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AmitarGalleryPlayer-windows
          path: dist/
          if-no-files-found: error
          retention-days: 30

  apple:
    name: macOS and unsigned iOS build validation
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Download the checksum-verified Gradle Wrapper JAR
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-gradle-wrapper-8.14.6
          path: android/gradle/wrapper
      - name: Generate platform hosts
        run: python3 tool/bootstrap_platforms.py
      - name: Download the exact analyzed source snapshot
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-quality-source-snapshot
          path: ${{ runner.temp }}/agp-quality-source
      - name: Download the exact resolved dependency lock
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-pubspec-lock
          path: ${{ runner.temp }}/agp-pubspec-lock
      - name: Apply the analyzed source and dependency snapshot
        run: >-
          python3 tool/apply_ci_snapshot.py
          --artifact-dir "$RUNNER_TEMP/agp-quality-source"
          --lock-file "$RUNNER_TEMP/agp-pubspec-lock/pubspec.lock"
      - name: Resolve dependencies from the tested lock
        run: flutter pub get --enforce-lockfile
      - name: Build macOS application bundle
        run: python3 tool/build.py macos --skip-bootstrap --skip-checks
      - name: Build unsigned iOS application bundle
        run: python3 tool/build.py ios --skip-bootstrap --skip-checks --keep-dist
      - name: Finalize Apple checksums
        run: python3 tool/finalize_artifacts.py --label apple
      - name: Upload Apple build validation outputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AmitarGalleryPlayer-apple-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30

  persist-quality-source-snapshot:
    name: Persist the exact source that passed every build
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs: [quality, linux-android-web, windows, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: amitar-gallery-player-persist-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout the triggering branch commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download the exact analyzed source snapshot
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-quality-source-snapshot
          path: ${{ runner.temp }}/agp-quality-source
      - name: Download the exact resolved dependency lock
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-pubspec-lock
          path: ${{ runner.temp }}/agp-pubspec-lock
      - name: Persist quality snapshot and refresh source checksums
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/agp-quality-source"
          lock_file="$RUNNER_TEMP/agp-pubspec-lock/pubspec.lock"
          files_list="$artifact_dir/changed-files.txt"
          [[ -f "$files_list" ]] || { echo "::error::Missing quality snapshot manifest."; exit 1; }
          [[ -f "$lock_file" ]] || { echo "::error::Missing resolved pubspec.lock artifact."; exit 1; }
          mapfile -t snapshot_files < "$files_list"

          for source_file in "${snapshot_files[@]}"; do
            case "$source_file" in
              lib/*.dart|test/*.dart|pubspec.yaml|analysis_options.yaml) ;;
              *) echo "::error::Disallowed quality snapshot path: $source_file"; exit 1 ;;
            esac
            [[ -f "$artifact_dir/$source_file" ]] || { echo "::error::Missing snapshot file: $source_file"; exit 1; }
          done

          protected_paths=(pubspec.lock)
          protected_paths+=("${snapshot_files[@]}")

          # Retry a branch-advance race once. Never overwrite a source/config
          # path changed after the triggering SHA; unrelated manifest commits
          # are safe and will be preserved by applying onto the newest branch.
          for attempt in 1 2; do
            git fetch --no-tags origin "$BRANCH_NAME"
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- "${protected_paths[@]}"; then
              echo "::error::A protected source/config/lock file changed after this run started; refusing to overwrite it."
              exit 1
            fi

            worktree_dir="$RUNNER_TEMP/amitar-quality-persist-$attempt"
            git worktree add --detach "$worktree_dir" FETCH_HEAD
            if (
              set -euo pipefail
              cd "$worktree_dir"
              python3 tool/apply_ci_snapshot.py \
                --root "$worktree_dir" \
                --artifact-dir "$artifact_dir" \
                --lock-file "$lock_file"
              if (( ${#snapshot_files[@]} > 0 )); then
                git add -- "${snapshot_files[@]}"
              fi
              git add -- pubspec.lock
              python3 tool/update_source_checksums.py
              git add -- SHA256SUMS.txt
              if git diff --cached --quiet; then
                echo "The branch already contains the exact quality source, lock and source checksums."
                exit 0
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(ci): persist verified source and dependency snapshot"
              git push origin "HEAD:${BRANCH_NAME}"
            ); then
              git worktree remove --force "$worktree_dir"
              exit 0
            fi

            git worktree remove --force "$worktree_dir" || true
            if (( attempt == 1 )); then sleep 2; fi
          done

          echo "::error::Could not persist the verified source snapshot. Check Actions write permission and branch protection rules."
          exit 1

  publish-github-release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-android-web, windows, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all platform build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: AmitarGalleryPlayer-*
          path: release-assets
          merge-multiple: true
      - name: Download the exact tested dependency lock
        uses: actions/download-artifact@v8.0.2
        with:
          name: agp-pubspec-lock
          path: resolved-lock
      - name: Include dependency lock in the release assets
        shell: bash
        run: cp resolved-lock/pubspec.lock release-assets/pubspec.lock
      - name: Verify and create release-wide SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -n "$(find . -maxdepth 1 -type f -name 'AmitarGalleryPlayer-*' -print -quit)"
          for f in SHA256SUMS-*.txt; do test -f "$f"; sha256sum --check "$f"; done
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "AmitarGalleryPlayer ${GITHUB_REF_NAME}"
