name: Refresh source checksum manifest

on:
  push:
    branches: [ Amitar, main, master ]
    paths-ignore:
      - 'SHA256SUMS.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amitar-source-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate and commit canonical source checksums
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the selected GitHub branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify Python runtime
        run: python3 --version

      - name: Generate canonical SHA-256 manifest
        run: python3 tool/update_source_checksums.py

      - name: Commit the refreshed manifest to this GitHub branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- SHA256SUMS.txt; then
            echo "SHA256SUMS.txt is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- SHA256SUMS.txt
          git commit -m "chore(ci): refresh canonical source checksums [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
